# OS Drive Protection (INV-LEGO-04):
# Point DATA_DIR and HYDRADB_DATA_DIR to dedicated non-OS storage volumes in production.
services:
  app:
    build:
      context: .
    container_name: hydrascope
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-4190}:4190"
    environment:
      PORT: "4190"
      DB_PATH: /app/data/hydrascope.db
      LOG_DIR: /app/data/logs
      HYDRADB_GRAPH_URL: ${HYDRADB_GRAPH_URL:-http://hydradb:8443}
      HYDRADB_GRAPH_TOKEN: ${HYDRADB_GRAPH_TOKEN:-hydrascope-local-dev-token}
      HYDRADB_GRAPH_ID: ${HYDRADB_GRAPH_ID:-hydrascope}
      HYDRADB_CELL_ID: ${HYDRADB_CELL_ID:-cell-0}
      HYDRADB_NAMESPACE: ${HYDRADB_NAMESPACE:-default}
      HYDRADB_ALLOW_LAN: ${HYDRADB_ALLOW_LAN:-true}
      HYDRASCOPE_ADMIN_TOKEN: ${HYDRASCOPE_ADMIN_TOKEN:-}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4190/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  hydradb-init:
    image: busybox:1.36
    container_name: hydrascope-hydradb-init
    profiles: ["hydradb"]
    command:
      - sh
      - -c
      - |
        mkdir -p /data/store /data/node-data-cache
        if [ ! -f /data/auth-token ]; then
          printf '%s\n' "${HYDRADB_GRAPH_TOKEN:-hydrascope-local-dev-token}" > /data/auth-token
        fi
        chmod -R 0777 /data/store /data/node-data-cache
        chmod 0644 /data/auth-token
    environment:
      HYDRADB_GRAPH_TOKEN: ${HYDRADB_GRAPH_TOKEN:-hydrascope-local-dev-token}
    volumes:
      - ${HYDRADB_DATA_DIR:-./data/hydradb}:/data

  hydradb:
    image: ghcr.io/hydra-db/hydradb:0.4.0
    container_name: hydrascope-hydradb
    profiles: ["hydradb"]
    depends_on:
      hydradb-init:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:9090:9090"
    environment:
      RUST_MIN_STACK: "33554432"
      GRAPH_USAGE_REPORT_ENABLED: "false"
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: hydrascope
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_DATA_PATH: data
      GRAPH_ALLOW_PLAINTEXT: "true"
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_DATA_CACHE_BYTES: "67108864"
      GRAPH_BOLT_NODE_ADDRESSES: "node-0=127.0.0.1:7687"
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_ADDR: "0.0.0.0:7687"
      GRAPH_HTTP_ADDR: "0.0.0.0:8443"
      GRAPH_ADMIN_ADDR: "0.0.0.0:9090"
      GRAPH_ADVERTISED_BOLT_ADDR: "127.0.0.1:7687"
      GRAPH_DATA_CACHE_DIR: /data/node-data-cache
    volumes:
      - ${HYDRADB_DATA_DIR:-./data/hydradb}:/data
